version: '3.8'

services:
  gateway-dispatcher:
    build: .
    command: python -m core.dispatcher
    environment:
      - PORT=8080
      - ENVIRONMENT=production
    ports:
      - "8080:8080"
    restart: always

  ledger-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dividend_ledger
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway_secure_pass
    volumes:
      - ledger_data:/var/lib/postgresql/data

  worker-node:
    build: .
    command: python -m node.worker
    environment:
      - DISPATCHER_URL=http://gateway-dispatcher:8080
    deploy:
      replicas: 3

volumes:
  ledger_data:
